    <script>(function () {

  window.__WEBAPP_EMBEDDED_VERSION__ = EMBED;

      if (done) return;

    };

      del.onsuccess = go; del.onerror = go; del.onblocked = go;

        document.open();
        document.write(rec.html);
        document.close();
      }
    };
  };
